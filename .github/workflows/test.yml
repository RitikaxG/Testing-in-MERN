name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL : "postgres://localhost:5321" # dummy URL
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup nodejs
        uses: actions/setup-node@v2 
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: 2-mocking-spying-express
        run: npm install 

      - name: Generate prisma client
        working-directory: 2-mocking-spying-express
        run: |
          npx prisma generate

      - name: Run test
        working-directory: 2-mocking-spying-express 
        run: npm run test