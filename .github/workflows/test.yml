name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup nodejs
        uses: actions/setup-node@v2 
        with:
          - node-version: '20'

      - name: Install Dependencies
        working-directory: 2-mocking-spying-express
        run: npm install && npx prisma init 

      - name: Run test
        working-directory: 2-mocking-spying-express 
        run: npm run test